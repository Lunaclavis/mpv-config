# 快捷键设置

# 鼠标
MBTN_LEFT            ignore
MBTN_LEFT_DBL        no-osd cycle fullscreen
MBTN_RIGHT           context-menu
MBTN_RIGHT_DBL       ignore
MBTN_MID             script-message-to context_menu open
MBTN_MID_DBL         ignore
MBTN_FORWARD         no-osd playlist-prev
MBTN_BACK            no-osd playlist-next
WHEEL_UP             add volume 5
WHEEL_DOWN           add volume -5
WHEEL_LEFT           ignore
WHEEL_RIGHT          ignore
Ctrl+MBTN_LEFT       script-binding positioning/drag-to-pan
Ctrl+MBTN_LEFT_DBL   ignore
Ctrl+MBTN_RIGHT      script-binding positioning/align-to-cursor
Ctrl+MBTN_RIGHT_DBL  ignore
Ctrl+MBTN_MID        ignore
Ctrl+MBTN_MID_DBL    ignore
Ctrl+MBTN_FORWARD    no-osd playlist-prev-playlist
Ctrl+MBTN_BACK       no-osd playlist-next-playlist
Ctrl+WHEEL_UP        script-binding positioning/cursor-centric-zoom 0.10
Ctrl+WHEEL_DOWN      script-binding positioning/cursor-centric-zoom -0.10

# 键盘
UP                   sub-seek -1
DOWN                 sub-seek 1
LEFT                 seek -3
RIGHT                seek 3
Ctrl+UP              seek -1 exact
Ctrl+DOWN            seek 1 exact
Ctrl+LEFT            seek -60
Ctrl+RIGHT           seek 60
PGUP                 playlist-prev
PGDWN                playlist-next
Ctrl+PGUP            playlist-prev-playlist
Ctrl+PGDWN           playlist-next-playlist
BS                   cycle mute
SPACE                cycle pause
ENTER                cycle fullscreen
ESC                  set fullscreen no
,                    frame-back-step
.                    frame-step
<                    add chapter -1
>                    add chapter 1
-                    add volume -1
=                    add volume 1
[                    add speed -0.1
]                    add speed 0.1
{                    add speed -1.0
}                    add speed 1.0
\                    set speed 1.0
`                    script-binding console/enable
e                    script-message-to open_dialog import_files
E                    script-message-to open_dialog import_files
i                    script-binding stats/display-stats
I                    script-binding stats/display-stats-toggle
o                    no-osd cycle-values osd-level 3 1
O                    no-osd cycle-values osd-level 3 1
p                    show-text ${playlist}
P                    show-text ${playlist}
q                    quit
Q                    quit-watch-later
x                    stop
X                    stop
r                    no-osd cycle-values video-rotate "0" "90" "180" "270"; show-text "画面旋转: ${video-rotate}°"
R                    no-osd cycle-values video-rotate "0" "90" "180" "270"; show-text "画面旋转: ${video-rotate}°"
t                    cycle ontop
T                    cycle ontop
a                    no-osd cycle-values keep-open "yes" "always"; script-message cycle-commands ``show-text "开启 自动播放"`` ``show-text "关闭 自动播放"``
A                    no-osd cycle-values keep-open "yes" "always"; script-message cycle-commands ``show-text "开启 自动播放"`` ``show-text "关闭 自动播放"``
l                    no-osd cycle-values loop-file "inf" "no"; show-text "文件循环: ${loop-file}"
L                    ab-loop
Ctrl+l               no-osd cycle-values loop-playlist "inf" "no"; show-text "列表循环: ${loop-playlist}"
Ctrl+L               no-osd cycle-values loop-playlist "inf" "no"; show-text "列表循环: ${loop-playlist}"
s                    screenshot
S                    screenshot video
Alt+s                screenshot window
Alt+S                screenshot scaled
Ctrl+s               screenshot each-frame
Ctrl+S               screenshot video+each-frame
Ctrl+Alt+s           screenshot window+each-frame
Ctrl+Alt+S           screenshot scaled+each-frame
Alt+z                add audio-delay -0.1
Alt+Z                add audio-delay -0.1
Alt+x                add audio-delay 0.1
Alt+X                add audio-delay 0.1
Alt+c                set audio-delay 0
Alt+C                set audio-delay 0
Alt+b                set sub-delay 0
Alt+B                set sub-delay 0
Alt+n                add sub-delay -0.1
Alt+N                add sub-delay -0.1
Alt+m                add sub-delay 0.1
Alt+M                add sub-delay 0.1
Alt+v                set sub-scale 1.0
Alt+V                set sub-scale 1.0
Alt+f                add sub-scale -0.1
Alt+F                add sub-scale -0.1
Alt+g                add sub-scale 0.1
Alt+G                add sub-scale 0.1
Alt+h                cycle-values hwdec "auto-copy" "auto" "no"
Alt+H                cycle-values hwdec "auto-copy" "auto" "no"
Alt+`                apply-profile "Reset-Equalizer"; show-text "重置均衡器"
Alt+1                add contrast -1
Alt+2                add contrast 1
Alt+3                add brightness -1
Alt+4                add brightness 1
Alt+5                add gamma -1
Alt+6                add gamma 1
Alt+7                add saturation -1
Alt+8                add saturation 1
Alt+9                add hue -1
Alt+0                add hue 1
Ctrl+`               vf clr ""; change-list glsl-shaders clr ""; show-text "清空所有着色器和滤镜"
Ctrl+1               apply-profile "General-A"; show-text "启用 通用配置 A"
Ctrl+2               apply-profile "General-B"; show-text "启用 通用配置 B"
Ctrl+3               apply-profile "General-C"; show-text "启用 通用配置 C"
Ctrl+4               apply-profile "General-D"; show-text "启用 通用配置 D"
Ctrl+5               apply-profile "Anime-A"; show-text "启用 动画配置 A"
Ctrl+6               apply-profile "Anime-B"; show-text "启用 动画配置 B"
Ctrl+7               apply-profile "Anime-C"; show-text "启用 动画配置 C"
Ctrl+8               script-message cycle-commands ``apply-profile "RTX-VSR"; vf append @RTX-VSR:d3d11vpp=format=nv12:scale=2:scaling-mode=nvidia; show-text "启用 RTX VSR"`` ``apply-profile "RTX-VSR" restore; vf remove @RTX-VSR; show-text "关闭 RTX VSR"``
Ctrl+9               vf clr ""; show-text "清空所有滤镜"
Ctrl+0               change-list glsl-shaders clr ""; show-text "清空所有着色器"
Ctrl+Alt+`           ignore
Ctrl+Alt+1           no-osd change-list glsl-shaders toggle "~~/shaders/KrigBilateral.glsl"; script-message cycle-commands ``show-text "开启 KrigBilateral"`` ``show-text "关闭 KrigBilateral"``
Ctrl+Alt+2           no-osd change-list glsl-shaders toggle "~~/shaders/CfL_Prediction.glsl"; script-message cycle-commands ``show-text "开启 CfL Prediction"`` ``show-text "关闭 CfL Prediction"``
Ctrl+Alt+3           no-osd change-list glsl-shaders toggle "~~/shaders/JointBilateral.glsl"; script-message cycle-commands ``show-text "开启 JointBilateral"`` ``show-text "关闭 JointBilateral"``
Ctrl+Alt+4           no-osd change-list glsl-shaders remove "~~/shaders/adaptive-sharpen_luma.glsl"; no-osd change-list glsl-shaders toggle "~~/shaders/adaptive-sharpen.glsl"; show-text "开/关 自适应锐化"
Ctrl+Alt+5           no-osd change-list glsl-shaders remove "~~/shaders/adaptive-sharpen.glsl"; no-osd change-list glsl-shaders toggle "~~/shaders/adaptive-sharpen_luma.glsl"; show-text "开/关 自适应锐化 (LUMA)"
Ctrl+Alt+6           ignore
Ctrl+Alt+7           ignore
Ctrl+Alt+8           cycle-values glsl-shader-opts adaptive-sharpen/STR=0.3 adaptive-sharpen/STR=0.5 adaptive-sharpen/STR=0.8 adaptive-sharpen/STR=1.0
Ctrl+Alt+9           cycle-values glsl-shader-opts adaptive-sharpen_luma/STR=0.3 adaptive-sharpen_luma/STR=0.5 adaptive-sharpen_luma/STR=0.8 adaptive-sharpen_luma/STR=1.0
Ctrl+Alt+0           no-osd cycle-values hdr-reference-white "auto" "100" "203"; show-text "参考白亮度: ${hdr-reference-white}"
F1                   cycle deband
F2                   cycle deinterlace
F3                   cycle sub-ass-use-video-data
F4                   ignore
F5                   ignore
F6                   vf toggle format:gamma=gamma2.2; show-text "开/关 修正伽马曲线为 gamma2.2"
F7                   vf toggle format:gamma=gamma2.4; show-text "开/关 修正伽马曲线为 gamma2.4"
F8                   vf toggle format:colorlevels=limited; show-text "开/关 重新标记色彩范围为 limited"
F9                   vf toggle format:primaries=bt.709; show-text "开/关 重新标记色彩原色为 bt.709"
F10                  vf toggle format:colormatrix=bt.709; show-text "开/关 重新标记色彩矩阵为 bt.709"
F11                  script-message-to console type "change-list glsl-shaders toggle ~~/shaders/"
F12                  script-message-to console type "change-list glsl-shader-opts append "
