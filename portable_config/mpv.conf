# 补充
load-context-menu=yes
include="~~/profiles.conf"
# use-filedir-conf=yes

# 日志
# log-file="~~desktop/mpv.log"

# 缓存
icc-cache=no
icc-cache-dir="~~/cache/icc_cache"
# gpu-shader-cache=no
gpu-shader-cache-dir="~~/cache/shaders_cache"

# 窗口
# border=no
title-bar=no
keepaspect=yes
keepaspect-window=yes
autofit-larger=100%x100%
autofit-smaller=50%x50%
window-corners=roundsmall
hidpi-window-scale=no
# window-dragging=no
title=${?pause==yes:⏸️}${?mute==yes:🔇}${?ontop==yes:📌}${?filename:${filename}}${!filename:mpv}

# 行为
idle=yes
keep-open=always
keep-open-pause=yes
autocreate-playlist=no
directory-mode=ignore
directory-filter-types=video,audio
reset-on-next-file=pause,vid,aid,sid,secondary-sid,af,loop-file,deinterlace,video-zoom,video-rotate,video-pan-x,video-pan-y,panscan,audio-delay,sub-delay,sub-speed,sub-pos,sub-scale,sub-visibility,secondary-sub-visibility
metadata-codepage=auto

# 播放记录
# save-watch-history=yes
watch-history-path="~~/cache/watch_history.jsonl"
# save-position-on-quit=yes
watch-later-dir="~~/cache/watch_later"
watch-later-options=start,vid,aid,sid,secondary-sid
# resume-playback=no
resume-playback-check-mtime=yes
write-filename-in-watch-later-config=yes
ignore-path-in-watch-later-config=no

# OSD
osd-on-seek=msg
osd-fractions=yes
osd-font=Noto Sans CJK SC
# osd-font-size=30
osd-playlist-entry=filename
# osd-duration=1000
osd-msg3=${playback-time/full} / ${duration/full} (${percent-pos}%)
osd-outline-size=1.0
osd-bar-align-x=0.20
osd-bar-align-y=-0.93
osd-bar-w=50.0
osd-bar-h=1.5

# 快捷键
input-builtin-bindings=no
input-default-bindings=no

# 解码
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
# gpu-api=vulkan
# gpu-context=winvk
hwdec=auto-copy
hwdec-codecs="h264,hevc,vp8,vp9,av1,ffv1"

# 渲染
scale=ewa_lanczossharp
cscale=catmull_rom
dscale=catmull_rom
scale-antiring=0.5
dscale-antiring=0.5
correct-downscaling=yes
linear-downscaling=no
sigmoid-upscaling=yes
linear-upscaling=no
deband-grain=16

# 色彩管理
profile=Target

# 着色器
profile=General-A

# 音画同步
interpolation=yes
tscale=oversample

# 音频
ao=wasapi
audio-channels=7.1,5.1,stereo
audio-file-auto=fuzzy
audio-file-paths=audio;audios;audio 5.1;audios 5.1;audio 7.1;audios 7.1;音轨
alang=japanese,jpn,jap,jp,ja,english,eng,en,chs,sc,chi,zho,zh
gapless-audio=no
volume-max=130
volume=100

# 字幕
sub-auto=fuzzy
sub-file-paths=sub;subs;subtitles;字幕
slang=chs,sc,zh-Hans,zh-CN,cht,tc,zh-Hant,zh-HK,zh-TW,chi,zho,zh,english,eng,en
sub-font=Noto Sans CJK SC
sub-font-size=50
sub-codepage=GB18030
blend-subtitles=no

# 截图
screenshot-format=png
screenshot-tag-colorspace=yes
# screenshot-high-bit-depth=no
screenshot-png-compression=0
screenshot-png-filter=0
screenshot-template="mpv-N%03n-%P"
screenshot-dir="~~desktop/Screenshot/"

# Software Scaler
sws-scaler=bicublin
sws-fast=no
# sws-allow-zimg=no
zimg-scaler=bicubic
zimg-scaler-param-a=1/3
zimg-scaler-param-b=1/3
zimg-scaler-chroma=bicubic
# zimg-dither=error-diffusion
zimg-fast=no

# Network
user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36"
# ytdl-format=(bestvideo*+bestaudio[format_id!*=?-drc]/best)[vcodec!*=?av01][height<=?2160]


# 常规配置

[Reset-Zoom]
profile-desc=重置缩放
video-zoom=0
video-pan-x=0
video-pan-y=0
video-align-x=0
video-align-y=0

[Reset-Equalizer]
profile-desc=重置均衡器
contrast=0
brightness=0
gamma=0
saturation=0
hue=0

