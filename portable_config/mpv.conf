glsl-shader="~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"

[RTX-VSR]
profile-desc=RTX VSR
profile-restore=copy-equal
hwdec=d3d11va

# 条件配置

# [Info]
# profile-desc=输出信息
# profile-cond=filename:find('电影') ~= nil
# term-playing-msg="电影"
# osd-playing-msg="电影"
# osd-playing-msg-duration=3000

[SD]
profile-desc=低清配置调整
profile-cond=p.width < 700 or p.height < 800
profile-restore=copy
profile=General-C

[UHD]
profile-desc=UHD 配置调整
profile-cond=get("video-params/w") > 6000 or get("video-params/h") > 3000
profile-restore=copy
hwdec=auto
# video-sync=audio

[PGS-Fix]
profile-desc=PGS 字幕比例修正
profile-cond=get("video-params/aspect") > 16 / 9
profile-restore=copy
stretch-image-subs-to-screen=yes

[Media-Title]
profile-desc=标题显示调整
profile-cond=p.demuxer_via_network == true or p.path:find('://') or p.path:find('^magnet:')
profile-restore=copy
title=${?pause==yes:⏸️}${?mute==yes:🔇}${?ontop==yes:📌}${?media-title:${media-title}}${!media-title:mpv}
osd-playlist-entry=title

# [Video-Sync]
# profile-desc=音画同步调整
# profile-cond=p.container_fps < 48 and p.container_fps > 20 and (p.display_fps/p.container_fps) < 3.2 and p.display_fps < 120 and p.speed == 1.0
# profile-restore=copy
# video-sync=display-resample

[Deband]
profile-desc=自动去色带
profile-cond=get("video-params/gamma") == "bt.1886" and get("video-params/w") < 6000 and get("video-params/h") < 3000 and get("video-params/average-bpp") < 24
profile-restore=copy
deband=yes

[Short-loop]
profile-desc=自动循环播放
profile-cond=p.duration < 60 and ( p["current-tracks/audio"] or not p["current-tracks/video/image"] )
loop-file=inf

[Speed-upper-limit]
profile-desc=播放速度上限
profile-cond=p.speed > 8.0
speed=8.0

[Speed-lower-limit]
profile-desc=播放速度下限
profile-cond=p.speed < 0.1
speed=0.1
