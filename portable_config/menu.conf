		倍率 (&M)																			disabled=not p["current-tracks/video"]
			25% (&1)							no-osd set window-scale 0.25				checked=math.floor(get("current-window-scale") * 1000 + 0.5) == 250
			50% (&2)							no-osd set window-scale 0.50				checked=math.floor(get("current-window-scale") * 1000 + 0.5) == 500
			100% (&3)							no-osd set window-scale 1.00				checked=math.floor(get("current-window-scale") * 1000 + 0.5) == 1000
			200% (&4)							no-osd set window-scale 2.00				checked=math.floor(get("current-window-scale") * 1000 + 0.5) == 2000
			300% (&5)							no-osd set window-scale 3.00				checked=math.floor(get("current-window-scale") * 1000 + 0.5) == 3000
			400% (&6)							no-osd set window-scale 4.00				checked=math.floor(get("current-window-scale") * 1000 + 0.5) == 4000
		填充 (&F)								no-osd set keepaspect yes; no-osd set keepaspect-window no; no-osd set panscan 1; apply-profile "Reset-Zoom"		checked=panscan == 1		disabled=not p["current-tracks/video"]
		拉伸 (&S)								no-osd set keepaspect no; no-osd set panscan 0; apply-profile "Reset-Zoom"		checked=not p.keepaspect		disabled=not p["current-tracks/video"]
		重置 (&R)								no-osd set keepaspect yes; no-osd set keepaspect-window yes; no-osd set panscan 0; apply-profile "Reset-Zoom"

	文件 (&F)																				disabled=p.idle_active
