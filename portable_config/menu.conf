		方向 (&R)
			默认 (&0)							no-osd set video-rotate "0"; show-text "重置画幅方向"						checked=p.video_rotate == 0
			向上 (&1)							no-osd set video-rotate "180"; show-text "画幅旋转: ${video-rotate}°"		checked=p.video_rotate == 180
			向左 (&2)							no-osd set video-rotate "90"; show-text "画幅旋转: ${video-rotate}°"		checked=p.video_rotate == 90
			向右 (&3)							no-osd set video-rotate "270"; show-text "画幅旋转: ${video-rotate}°"		checked=p.video_rotate == 270
		比例 (&A)
			自动 (&0)							no-osd set video-aspect-override no; show-text "原始画幅比例"				checked=p.video_aspect_override < 0
			2.39:1 (&1)							no-osd set video-aspect-override 2.39:1; show-text "画幅比例 2.39:1"		checked=p.video_aspect_override == 2.39
			2.35:1 (&2)							no-osd set video-aspect-override 2.35:1; show-text "画幅比例 2.35:1"		checked=p.video_aspect_override == 2.35
			16:9 (&3)							no-osd set video-aspect-override 16:9; show-text "画幅比例 16:9"			checked=math.abs(p.video_aspect_override - 1.77) < 0.01
			4:3 (&4)							no-osd set video-aspect-override 4:3; show-text "画幅比例 4:3"				checked=math.abs(p.video_aspect_override - 1.33) < 0.01
			1:1 (&5)							no-osd set video-aspect-override 1:1; show-text "画幅比例 1:1"				checked=p.video_aspect_override == 1.00
		缩放 (&Z)
			默认 (&0)							no-osd set video-zoom 0; show-text "重置缩放"								checked=p.video_zoom == 0
			25% (&1)							no-osd set video-zoom -2; show-text "缩放比例: 25%"							checked=p.video_zoom == -2
			50% (&2)							no-osd set video-zoom -1; show-text "缩放比例: 50%"							checked=p.video_zoom == -1
			200% (&3)							no-osd set video-zoom 1; show-text "缩放比例: 200%"							checked=p.video_zoom == 1
			400% (&4)							no-osd set video-zoom 2; show-text "缩放比例: 400%"							checked=p.video_zoom == 2

			重置缩放及位置 (&R)					apply-profile "Reset-Zoom"; show-text "重置缩放及位置"
