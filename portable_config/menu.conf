			display-p3							no-osd set target-prim "display-p3"; show-text "色彩空间: ${target-prim}"		checked=p.target_prim == "display-p3"
			dci-p3								no-osd set target-prim "dci-p3"; show-text "色彩空间: ${target-prim}"			checked=p.target_prim == "dci-p3"
			bt.2020								no-osd set target-prim "bt.2020"; show-text "色彩空间: ${target-prim}"			checked=p.target_prim == "bt.2020"
		显示色域 (&G)
			自动 (&0)							no-osd set target-gamut "auto"; show-text "显示色域: ${target-gamut}"				checked=p.target_gamut == "auto" or p.target_gamut == ""
			bt.709 (&0)							no-osd set target-gamut "bt.709"; show-text "显示色域: ${target-gamut}"				checked=p.target_gamut == "bt.709"
			display-p3 (&0)						no-osd set target-gamut "display-p3"; show-text "显示色域: ${target-gamut}"			checked=p.target_gamut == "display-p3"
			dci-p3 (&0)							no-osd set target-gamut "dci-p3"; show-text "显示色域: ${target-gamut}"				checked=p.target_gamut == "dci-p3"
			bt.2020 (&0)						no-osd set target-gamut "bt.2020"; show-text "显示色域: ${target-gamut}"			checked=p.target_gamut == "bt.2020"
		传输特性 (&T)
			自动 (&0)							no-osd set target-trc "auto"; show-text "传输特性曲线: ${target-trc}"			checked=p.target_trc == "auto"
			bt.1886 (&1)						no-osd set target-trc "bt.1886"; show-text "传输特性曲线: ${target-trc}"		checked=p.target_trc == "bt.1886"
			gamma2.2 (&2)						no-osd set target-trc "gamma2.2"; show-text "传输特性曲线: ${target-trc}"		checked=p.target_trc == "gamma2.2"
			gamma2.4 (&3)						no-osd set target-trc "gamma2.4"; show-text "传输特性曲线: ${target-trc}"		checked=p.target_trc == "gamma2.4"
			srgb (&4)							no-osd set target-trc "srgb"; show-text "传输特性曲线: ${target-trc}"			checked=p.target_trc == "srgb"
			scrgb (&5)							no-osd set target-trc "scrgb"; show-text "传输特性曲线: ${target-trc}"			checked=p.target_trc == "scrgb"
			pq (&6)								no-osd set target-trc "pq"; show-text "传输特性曲线: ${target-trc}"				checked=p.target_trc == "pq"

